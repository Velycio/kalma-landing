name: Blog semanal (Kalma)

# Se ejecuta en los servidores de GitHub (no necesita tu ordenador).
# Martes 02:00 UTC ≈ 04:00 hora peninsular de España (verano).
on:
  schedule:
    - cron: "0 2 * * 2"
  workflow_dispatch: {} # permite lanzarlo a mano para probar

permissions:
  contents: write
  issues: write

jobs:
  nuevo-post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Redactar artículo con Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.MODEL }}
        run: node scripts/generate-post.mjs

      - name: Regenerar el sitio
        run: node scripts/build-site.mjs

      # Datos del artículo recién generado (el .json más reciente de posts/)
      - name: Leer el artículo generado
        id: post
        run: |
          FILE=$(ls -t posts/*.json | head -1)
          echo "slug=$(node -p "require('./$FILE').slug")" >> "$GITHUB_OUTPUT"
          echo "title=$(node -p "require('./$FILE').title")" >> "$GITHUB_OUTPUT"

      # Publica directamente en main. GitHub Pages despliega solo en 1-2 min.
      - name: Publicar en kalmaapp.pro
        run: |
          git config user.name "Kalma Bot"
          git config user.email "info@velycio.com"
          git add -A
          git diff --staged --quiet && echo "Sin cambios, nada que publicar" && exit 0
          git commit -m "blog: ${{ steps.post.outputs.title }}"
          git push

      # Aviso POSTERIOR: GitHub manda el email a info@velycio.com al abrir el issue.
      - name: Avisar a Charly de que ya está publicado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Publicado en el blog: ${{ steps.post.outputs.title }}" \
            --assignee Velycio \
            --body "Ya está en vivo: https://kalmaapp.pro/blog/${{ steps.post.outputs.slug }}.html

          Publicado automáticamente por el agente semanal de Kalma. No hace falta que hagas nada.

          **Es contenido de salud.** Si al leerlo ves algo que no te cuadra, dilo y se retira: basta con borrar \`posts/${{ steps.post.outputs.slug }}.json\`, volver a generar el sitio y publicar.

          Cierra este aviso cuando lo hayas leído."
